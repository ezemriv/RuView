services:
  sensing-server:
    environment:
      CSI_SOURCE: simulated
    ports: !override
      - target: 3000
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp

  telegram-alarm:
    image: ${ALARM_IMAGE:-ruview/home-alarm-smoke:test}
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      RUVIEW_API_TOKEN: ${RUVIEW_API_TOKEN}
      TELEGRAM_BASE_URL: http://telegram-fake:8080
      POLL_SECONDS: "0.25"
      TELEGRAM_POLL_SECONDS: "1"
    volumes: !override
      - alarm-smoke-state:/data

  telegram-fake:
    image: python:3.12-slim
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    entrypoint: ["python3", "/fake_telegram_api.py"]
    command: []
    volumes:
      - ./tests/fake_telegram_api.py:/fake_telegram_api.py:ro
    ports:
      - target: 8080
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp
    networks:
      - alarm-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  alarm-smoke-state:
