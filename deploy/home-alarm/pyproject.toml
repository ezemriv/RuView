[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ruview-alarm"
version = "0.1.0"
description = "RuView home alarm service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
provision = [
    "esptool>=5,<6",
    "esp-idf-nvs-partition-gen>=1.0,<2",
]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ruview_alarm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
